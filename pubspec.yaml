name: gps_camera_app
description: "GPS Camera mobile application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Typography (Inter, all weights)
  google_fonts: ^6.2.1

  # SVG illustrations
  flutter_svg: ^2.0.10+1

  # Lottie / dotLottie animations
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.4
  permission_handler: ^13.0.1
  device_info_plus:  ^11.2.0
  shared_preferences: ^2.5.5
  camera: ^0.12.0+2
  gal: ^2.3.3
  path_provider: ^2.1.6
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  firebase_app_installations: ^0.4.3
  flutter_local_notifications: ^22.3.0
  native_device_orientation: ^2.1.1
  flutter_image_compress: ^2.5.1
  image: ^4.9.2
  native_exif: ^0.8.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  pdf: ^3.13.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true